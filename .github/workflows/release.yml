name: release

# Tagging vX.Y.Z builds the app on macOS (universal) and Windows, publishes the
# GitHub release, and attaches a `gaze.rb` cask generated from the real dmg
# checksum — copy that file into abcdlsj/homebrew-tap's Casks/.
#
# The bundle version comes from src-tauri/tauri.conf.json, which must match the
# tag: the first step fails the run otherwise.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -n "${{ inputs.tag }}" ]]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          CONFIG="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          if [[ "$VERSION" != "$CONFIG" ]]; then
            echo "::error::tag is v$VERSION but tauri.conf.json says $CONFIG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  darwin:
    needs: check-version
    # macos-15 is Apple silicon and can lipo both slices into one universal app.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: darwin-universal
      - run: pnpm install --frozen-lockfile
      - name: Build universal bundle
        env:
          # No Developer ID in CI: let Tauri ad-hoc sign the app. Homebrew installs
          # carry no quarantine attribute, so the app still launches after `brew install`.
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg,app
      - name: Package
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          BASE="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p artifacts
          DMG="$(ls "$BASE"/dmg/*.dmg | head -1)"
          mv "$DMG" "artifacts/gaze_${VERSION}_darwin_universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$BASE/macos/Gaze.app" \
            "artifacts/gaze_${VERSION}_darwin_universal.zip"
          shasum -a 256 artifacts/* | tee artifacts/SHA256SUMS-darwin.txt
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: artifacts/*
          if-no-files-found: error

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis,msi
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi  = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi  | Select-Object -First 1
          Copy-Item $nsis.FullName "artifacts/gaze_$($env:VERSION)_windows_amd64_setup.exe"
          Copy-Item $msi.FullName  "artifacts/gaze_$($env:VERSION)_windows_amd64.msi"
          Compress-Archive -Path src-tauri/target/release/Gaze.exe `
            -DestinationPath "artifacts/gaze_$($env:VERSION)_windows_amd64_portable.zip"
          Get-ChildItem artifacts -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content artifacts/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: [check-version, darwin, windows]
    runs-on: ubuntu-24.04
    steps:
      # Checkout first: it runs `git clean -ffdx`, which would delete artifacts
      # that were downloaded before it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "Gaze ${VERSION}"
            echo
            echo "Fast screenshot, scrolling capture and annotation for macOS and Windows."
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              echo
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}"
            else
              echo "## Changes"
              echo
              git log --no-merges --pretty='- %s' "${TAG}"
            fi
            echo
            cat <<EOF
          ## Assets

          | Platform | File | Notes |
          | --- | --- | --- |
          | macOS 12+ | \`gaze_${VERSION}_darwin_universal.dmg\` / \`.zip\` | Universal (Apple silicon + Intel). Ad-hoc signed, not notarised: a browser download needs right-click → Open, or \`xattr -dr com.apple.quarantine /Applications/Gaze.app\`. |
          | Windows 10+ | \`gaze_${VERSION}_windows_amd64_setup.exe\` / \`.msi\` / \`_portable.zip\` | Needs the WebView2 runtime (preinstalled on Windows 11). |

          ## Install

          macOS, through the Homebrew tap:

          \`\`\`sh
          brew tap abcdlsj/tap
          brew trust abcdlsj/tap
          brew install --cask gaze
          \`\`\`

          ## First run

          The app lives in the menu bar. Grant **Screen Recording** and **Accessibility** in
          Preferences → Advanced (or System Settings → Privacy & Security), then capture with
          \`F1\` (area) or \`Shift+F1\` (scrolling long screenshot).
          EOF
          } > NOTES.md
      - name: Generate signed update manifest (latest.json)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/generate-update-manifest.py \
            --app gaze \
            --repo "${{ github.repository }}" \
            --tag "${TAG}" \
            --version "${VERSION}" \
            --bundle-id dev.abcdlsj.gaze \
            --bundle-name Gaze.app \
            --min-os 12.0 \
            --notes-file NOTES.md \
            --out-dir artifacts \
            --asset "darwin-universal=artifacts/gaze_${VERSION}_darwin_universal.zip" \
            --asset "windows-x86_64=artifacts/gaze_${VERSION}_windows_amd64_setup.exe"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Idempotent so a failed or re-run workflow can publish the same tag again.
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Gaze $VERSION" --notes-file NOTES.md
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Gaze $VERSION" --notes-file NOTES.md
          fi

      # The cask pins the universal dmg, so it can only be written once that file
      # exists: generate it from the release asset itself, never from a transcription.
      - name: Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          DMG="artifacts/gaze_${VERSION}_darwin_universal.dmg"
          [ -f "$DMG" ] || { echo "::error::missing $DMG"; ls -R artifacts; exit 1; }
          SHA="$(sha256sum "$DMG" | cut -d' ' -f1)"
          cat > gaze.rb <<EOF
          # typed: strict
          # frozen_string_literal: true

          cask "gaze" do
            version "${VERSION}"

            sha256 "${SHA}"

            url "https://github.com/abcdlsj/gaze/releases/download/v#{version}/gaze_#{version}_darwin_universal.dmg"
            name "Gaze"
            desc "Fast screenshot, scrolling capture and annotation for macOS and Windows"
            homepage "https://github.com/abcdlsj/gaze"

            depends_on macos: :monterey

            app "Gaze.app"

            zap trash: [
              "~/Library/Application Support/dev.abcdlsj.gaze",
              "~/Library/Caches/dev.abcdlsj.gaze",
              "~/Library/HTTPStorages/dev.abcdlsj.gaze",
              "~/Library/Preferences/dev.abcdlsj.gaze.plist",
              "~/Library/Saved Application State/dev.abcdlsj.gaze.savedState",
              "~/Library/WebKit/dev.abcdlsj.gaze",
            ]
          end
          EOF
          cat gaze.rb
          command -v ruby >/dev/null && ruby -c gaze.rb
          gh release upload "$TAG" gaze.rb --repo "$GITHUB_REPOSITORY" --clobber
